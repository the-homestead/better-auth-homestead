name: Feature request
description: Propose an improvement to an existing plugin or repository tooling.
title: "feat: "
body:
  - type: input
    id: package
    attributes:
      label: Package or area
      placeholder: "@homestead-systems/ba-steam"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Explain the user problem rather than only the desired implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
