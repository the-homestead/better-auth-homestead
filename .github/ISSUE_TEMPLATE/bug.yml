name: Bug report
description: Report reproducible incorrect behavior in a Homestead Better Auth plugin.
title: "fix: "
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@itzdabbzz/better-auth-steam"
        - "@itzdabbzz/better-auth-cfx"
        - Repository tooling
        - Another package
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include the plugin, Better Auth, Bun or Node.js, and TypeScript versions.
      placeholder: "Plugin 0.1.0, Better Auth 1.6.26, Bun 1.3.13, TypeScript 7.0.2"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe example that reproduces the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed client secrets, access tokens, cookies, and personal account data.
          required: true
        - label: This is not a security vulnerability.
          required: true
