name: New plugin proposal
description: Propose another Better Auth plugin for the Homestead collection.
title: "feat: propose "
body:
  - type: input
    id: provider
    attributes:
      label: Provider or capability
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Explain who needs this plugin and what it enables.
    validations:
      required: true

  - type: textarea
    id: protocol
    attributes:
      label: Authentication protocol and documentation
      description: Link official OAuth, OIDC, API, or SDK documentation when available.
    validations:
      required: true

  - type: textarea
    id: account-data
    attributes:
      label: Account data
      description: List identifiers, profile fields, scopes, and tokens the plugin would handle.
    validations:
      required: true

  - type: checkboxes
    id: maintenance
    attributes:
      label: Maintenance
      options:
        - label: I understand that a proposal does not guarantee implementation or a release date.
          required: true
